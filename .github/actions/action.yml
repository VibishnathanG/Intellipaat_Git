name: "Get & and Cache the dependencies"
description: "Composite Fucntion used for cacheing"
runs:
  using: 'composite'
  steps:
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v5
        with:
          path: ./node_modules/
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
        shell: bash