name: E5 Caching and Action call
on:
  push:
    branches:
      - DEV
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v6

# Calling Composite Actions -- Self Actions under /actions
      - name: Load cache dependencies
        uses: ./.github/actions
        with:
          caching: 'true'

      - name: Lint code
        continue-on-error: true
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v6

# Calling Composite Actions -- Self Actions under /actions
      - name: Load cache dependencies
        uses: ./.github/actions

      - name: Test code
        continue-on-error: true
        id: test-block
        run: npm run test

      - name: Upload test report
        if: failure() && steps.test-block.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: test-report
          path: test.json
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v6

# Calling Composite Actions -- Self Actions under /actions
      - name: Load cache dependencies
        id: "build-cache"
        uses: ./.github/actions
        with:
          caching: 'false'
      
      - name: Output Printing
        run: echo "Cache Used? ${{ steps.build-cache.outputs.used-cache }}"

      - name: Build website
        id: build-website
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-files
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist-files

      - name: Output contents
        run: ls

      - name: Deploy
        run: echo "Deploying..."

  report:
    needs: [lint, deploy]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Pipeline Failed
        run: echo "Pipeline Is having issue Please Check"