name: Matrix Testing
on:
  push:
    branches:
      - SIT
jobs:
  CI-Job:
    name: CI for this app
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: NPM Install
          run: npm ci
        
        - name: Cache the dependencies
          uses: actions/cache@v5
          with:
            path: |
              ~/.npm
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

        - name: Build Project
          run: npm run build
        
        - name: name of the jsx files
          id: name-publish
          run: find ./dist/assets/*.js -type f -execdir echo 'script-name={}' >> $GITHUB_OUTPUT ';' 
        
        - name: artifacts save
          uses: actions/upload-artifact@v6
          with:
            name: artifacts
            path: |
              ./dist
              package.json


  call-workflow:
    needs: matrix-J1
    uses: ./.github/workflows/callable-flow.yml
    with:
      artifactName: artifacts



