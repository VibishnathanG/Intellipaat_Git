name: Matrix Testing
on:
  push:
    branches:
      - SIT
jobs:
  matrix-J1:
    strategy:
      matrix:
        node-version: [16, 18, 20]
        os: [ubuntu-latest, windows-latest]
        include:
          - node-version: 16
            os: ubuntu-latest
          - node-version: 18
            os: windows-latest
          - node-version: 20
            os: macos-latest
        exclude:
          - node-version: 16
            os: windows-latest
          - node-version: 20
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get code
        uses: actions/checkout@v6
        
      - name: Testing Matrix
        run: echo "Hello World"

      - name: Testing Node and Os
        run: echo "Printing Node and OS details --> ${{ matrix.node-version }} OS Name --> ${{ matrix.os }} Repo Name --> ${{ github.action_repository }}"
      
      - name: calling the callable
        uses: ./.github/workflow/callable-flow.yml
